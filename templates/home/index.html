<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOME PAGES</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/home.css') }}">
</head>
<body>
  
  <h1>Hello World</h1>
  {% if comments|length == 0 %}
    <h3>No comments available</h3>
  {% else %}
    {% for c in comments %}
      <p>{{ c }}</p>
    {% endfor %}
  {% endif %}
  
</body>
</html>
